name: reproducibility-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install classical-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=2.1,<3" "pandas>=2.2,<3" "scipy>=1.16,<2" "scikit-learn>=1.6,<2" "matplotlib>=3.7" "tqdm>=4.66" "pillow>=9.1"

      - name: Compile public scripts
        run: |
          python -m py_compile run_strengthening.py
          python -m py_compile run_source_size_audit.py
          python -m py_compile make_results_tables.py
          python -m py_compile extract_clipiqa_scores.py
          python -m py_compile test_interval_score.py

      - name: Interval-score unit tests
        run: python test_interval_score.py

      - name: Structural analysis self-test
        run: python run_strengthening.py --mode selftest --outdir outputs/ci_selftest
